[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "timed-mission-agent"
version = "0.3.0"
description = "Timed microtask execution core with SLA, validation, recovery and evidence."
requires-python = ">=3.12"
dependencies = ["Pillow==11.3.0"]

[project.scripts]
timed-mission-agent = "timed_mission_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
